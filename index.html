<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Apps Event Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@700;900&family=Overpass:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Brand: NASA Space Apps palette. Light work surfaces, deep blue header. */
:root{--db:#07173F;--eb:#0042A6;--by:#2E96F5;--ny:#EAFE07;--rr:#E43700;--mr:#8E1100;
  --bg:#eef2f8;--card:#fff;--fg:#0b1633;--muted:#5a6785;--line:#d8dfeb;--ok:#13804b;--okbg:#e3f6ec;--warn:#9a5b00;--warnbg:#fff3d6;--bad:#b42318;--badbg:#fde8e7;
  --h:"Fira Sans","Arial Black",system-ui,sans-serif;--b:"Overpass",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--b);font-size:15px;line-height:1.45}
a{color:var(--eb)}
header.top{background:linear-gradient(135deg,var(--eb),var(--db));color:#fff;padding:10px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header.top img{display:block}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:220px}
.brand .sa{height:40px;width:auto}.brand .pt{height:30px;width:auto}
.top select{width:auto;max-width:260px}
.top select,.top button{font:600 13px var(--b);border-radius:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;padding:7px 10px}
.top select option{color:#000}
.who{font-size:12.5px;opacity:.9;text-align:right}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 max(10px,env(safe-area-inset-left));position:sticky;top:60px;z-index:19}
nav.tabs a{padding:12px 14px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs a.on{color:var(--db);border-bottom-color:var(--eb)}
main{max-width:1280px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 60px}
h1,h2,h3{font-family:var(--h);font-weight:900;margin:0;letter-spacing:.01em}
h1{font-size:26px}h2{font-size:19px}h3{font-size:15px}
.sub{color:var(--muted);margin:4px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.kpi .l{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--h);font-weight:900;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.hl{background:linear-gradient(135deg,var(--eb),var(--db));color:#fff;border:0}.kpi.hl .l,.kpi.hl .s{color:#c9d6f2}
.banner{border-radius:10px;padding:14px 16px;font-weight:600;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.ok{background:var(--okbg);color:var(--ok)}.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.info{background:#e7f0fd;color:var(--eb)}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.c-reg{background:#e7f0fd;color:var(--eb)}.c-wait{background:var(--warnbg);color:var(--warn)}.c-prom{background:#efe7ff;color:#5b2bbd}.c-left{background:#eceff4;color:#5a6785}.c-att{background:var(--okbg);color:var(--ok)}.c-seat{background:var(--db);color:#fff}.c-bad{background:var(--badbg);color:var(--bad)}.c-cap{background:var(--rr);color:#fff}
button,.btn{font:700 13.5px var(--b);border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--fg);padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--eb);border-color:var(--eb);color:#fff}button.ok{background:var(--ok);border-color:var(--ok);color:#fff}button.danger{color:var(--bad);border-color:#f3b8b3}button.big{font-size:17px;padding:14px 20px}
button.sm{padding:5px 9px;font-size:12.5px}
:focus-visible{outline:3px solid var(--by);outline-offset:2px}
input,select,textarea{font:15px var(--b);border:1px solid var(--line);border-radius:7px;padding:9px 10px;background:#fff;color:var(--fg);width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form .full{grid-column:1/-1}
@media(max-width:640px){.form{grid-template-columns:1fr}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#f6f8fc;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #edf1f7;vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13.5px}
.bar .t{height:12px;background:#edf1f7;border-radius:6px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--eb);border-radius:6px}
.bar .t i.b2{background:var(--by)}
.pcard{border:2px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;background:#fff}
.pcard .name{font-family:var(--h);font-weight:900;font-size:26px;line-height:1.1}
.teambox{border-radius:10px;padding:14px;background:linear-gradient(135deg,var(--eb),var(--db));color:#fff;display:flex;gap:16px;align-items:center}
.teambox .no{font-family:var(--h);font-weight:900;font-size:44px;line-height:1;color:var(--ny);min-width:70px;text-align:center}
.teambox.none{background:var(--warnbg);color:var(--warn)}
#reader{width:100%;max-width:520px;border-radius:12px;overflow:hidden;background:#000}
.modal{position:fixed;inset:0;background:rgba(7,23,63,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal .box{background:#fff;border-radius:12px;padding:20px;max-width:720px;width:100%;display:grid;gap:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--db);color:#fff;padding:12px 18px;border-radius:10px;font-weight:700;z-index:60;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.err{background:var(--bad)}
.login{max-width:420px;margin:50px auto;display:grid;gap:14px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.pass{background:linear-gradient(135deg,var(--eb),var(--db));color:#fff;border-radius:16px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.pass .qr{background:#fff;padding:8px;border-radius:8px}
.demo{background:var(--ny);color:var(--db);font-weight:700;font-size:13px;text-align:center;padding:6px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}.live i{width:8px;height:8px;border-radius:50%;background:#3ddc97;display:inline-block}
</style>
</head>

  <select id="locSel" aria-label="Location"></select>
  <div class="who" id="who"></div>
  <button id="signOut" type="button">Sign out</button>
</header>
<nav class="tabs" id="tabs" hidden></nav>
<main id="app"></main>

<div id="modalRoot"></div>

function stats(P, L) {
  const cap = L.reduce((a, l) => a + (+l.capacity || 0), 0);
  const live = P.filter(p => p.status !== 'cancelled');
  const r = {cap,
    reg: live.filter(p => p.original_status === 'registered').length,
    wait: live.filter(p => p.original_status === 'waitlisted').length,
    prom: live.filter(p => p.promoted_at).length,
    att: live.filter(p => p.attended_at).length,
    attReg: live.filter(p => p.attended_at && p.original_status === 'registered').length,
    attWait: live.filter(p => p.attended_at && p.original_status === 'waitlisted').length,
    queue: live.filter(p => p.attended_at && p.status === 'waitlisted' && !p.left_at).length,
    seated: live.filter(p => p.seated_at && !p.left_at).length,
    left: live.filter(p => p.status === 'left').length,
    used: live.filter(p => p.attended_at && p.status === 'registered' && !p.left_at).length};

  $('#eSave').onclick = async () => { try { const row = {name: $('#eName').value.trim(), year: +$('#eYear').value}; if (E) await api.update('events', E.id, row); else await api.insert('events', row); await reload(); vSettings(); toast('Saved'); } catch (e) { toast(e.message, true); } };
  $('#addL').onclick = () => locModal(null); $$('[data-l]').forEach(b => b.onclick = () => locModal(locById(b.dataset.l)));
  $('#addC').onclick = () => chModal(null); $$('[data-c]').forEach(b => b.onclick = () => chModal(chById(b.dataset.c)));
  if (DEMO) { $('#dGo').onclick = () => { const r = $('#dRole').value; api.demoSetRole(r, ['admin','technical','executive'].includes(r) ? null : locs()[0].id); location.hash = '#dashboard'; location.reload(); }; $('#dReset').onclick = () => confirmBox('Reset all demo data?', api.demoReset); }
}
function toLocalInput(t) { if (!t) return ''; const d = new Date(t), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`; }
function locModal(l) {
  modal(`<h2>${l ? 'Edit location' : 'Add location'}</h2><div class="form"><label class="f">Location name<input id="m_name" placeholder="Riffa"></label><label class="f">Venue<input id="m_venue"></label><label class="f">Pass ID prefix<input id="m_code" placeholder="RF26"></label><label class="f">Capacity (seats)<input id="m_capacity" type="number" min="0"></label>
  <label class="f">Attendance deadline<input id="m_dl" type="datetime-local" value="${toLocalInput(l?.attendance_deadline)}"></label><label class="f">Accept the waiting list<select id="m_acc"><option value="0">No</option><option value="1">Yes</option></select></label></div>`,
  async () => { const row = {name: $('#m_name').value.trim(), venue: $('#m_venue').value.trim() || null, code: $('#m_code').value.trim().toUpperCase(), capacity: +$('#m_capacity').value || 0, attendance_deadline: $('#m_dl').value ? new Date($('#m_dl').value).toISOString() : null, accept_waitlist: $('#m_acc').value === '1'};
    if (!row.name || !row.code) throw new Error('Name and pass prefix are required');
    if (l) await api.update('locations', l.id, row); else await api.insert('locations', {...row, event_id: S.data.events[0].id}); await reload(); buildLocSel(); render(); toast('Location saved'); }, l || {capacity: 100});
  $('#m_acc').value = l?.accept_waitlist ? '1' : '0';
}
function chModal(c) {
  modal(`<h2>${c ? 'Edit challenge' : 'Add challenge'}</h2><div class="form"><label class="f full">Challenge name<input id="m_name"></label><label class="f">Destination on pass<input id="m_destination" placeholder="Mars, Moon, Earth…"></label></div>`,
  async () => { const row = {name: $('#m_name').value.trim(), destination: $('#m_destination').value.trim() || null}; if (!row.name) throw new Error('Name is required');
    if (c) await api.update('challenges', c.id, row); else await api.insert('challenges', {...row, event_id: S.data.events[0].id}); await reload(); render(); toast('Saved'); }, c, c ? () => api.remove('challenges', c.id) : null);
}
async function vUsers() {
  $('#app').innerHTML = '<h1>Users</h1><p class="sub">Loading…</p>';
  let U = []; try { U = await api.profiles(); } catch (e) { toast(e.message, true); }
  $('#app').innerHTML = `<h1>Users</h1><p class="sub">People create their own account on the sign-in page. Give each one a role and a location here. Admin, Technical and Executive see all locations.</p>
  <div class="tw" style="margin-top:12px"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Location</th></tr>${U.map(u => `<tr><td>${esc(u.full_name || '')}</td><td>${esc(u.email || '')}</td><td><select data-u="${u.user_id}" data-k="role">${Object.entries(ROLE_NAMES).map(([k, v]) => `<option value="${k}" ${u.role === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td><td><select data-u="${u.user_id}" data-k="location_id"><option value="">All / none</option>${locs().map(l => `<option value="${l.id}" ${u.location_id === l.id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></td></tr>`).join('')}</table></div>
  <div class="card" style="margin-top:14px"><h3>What each role can do</h3><ul class="small"><li><b>Admin / Technical</b>: everything, every location; can promote above capacity.</li><li><b>Registration committee</b>: check-in, seating, waiting list, participants, teams for their location.</li><li><b>Volunteer coordinator</b>: volunteers, committees and mentors: attendance and duties.</li><li><b>VIP committee</b>: judges, arrival, panels.</li><li><b>Executive</b>: all dashboards and lists, read only.</li></ul></div>`;
  $$('[data-u]').forEach(s => s.onchange = async () => { try { await api.update('profiles', s.dataset.u, {[s.dataset.k]: s.value || null}, 'user_id'); toast('Saved'); } catch (e) { toast(e.message, true); } });
}

/* ===================== shared UI ===================== */
function modal(html, onSave, values, onDelete) {
  S.busy = true;
  $('#modalRoot').innerHTML = `<div class="modal"><div class="box" role="dialog" aria-modal="true">${html}<div class="row"><button class="pri" id="mSave">Save</button><button id="mCancel">Cancel</button><span class="sp"></span>${onDelete ? '<button class="danger" id="mDel">Delete</button>' : ''}</div><p class="small" id="mErr" style="color:var(--bad)"></p></div></div>`;
  if (values) Object.entries(values).forEach(([k, v]) => { const el = $('#m_' + k); if (el && v != null) el.value = v; });
  const close = () => { $('#modalRoot').innerHTML = ''; S.busy = false; };
  $('#mCancel').onclick = close;
  $('#mSave').onclick = async () => { try { $('#mSave').disabled = true; await onSave(); close(); } catch (e) { $('#mErr').textContent = e.message; $('#mSave').disabled = false; } };
  if (onDelete) $('#mDel').onclick = () => { if ($('#mDel').dataset.c) { onDelete().then(async () => { close(); await reload(); render(); toast('Deleted'); }).catch(e => $('#mErr').textContent = e.message); } else { $('#mDel').dataset.c = 1; $('#mDel').textContent = 'Click again to delete'; } };
  const first = $('.modal input, .modal select'); first && first.focus();
}
function confirmBox(msg, yes) {
  $('#modalRoot').innerHTML = `<div class="modal"><div class="box" role="dialog" aria-modal="true" style="max-width:440px"><p style="margin:0;font-weight:600">${esc(msg)}</p><div class="row"><button class="pri" id="cYes">Yes</button><button id="cNo">Cancel</button></div></div></div>`;
  $('#cNo').onclick = () => $('#modalRoot').innerHTML = ''; $('#cYes').onclick = () => { $('#modalRoot').innerHTML = ''; yes(); };
}
function importModal(table, keys, hint) {
  const l = curLoc();
  modal(`<h2>Import ${table === 'judges' ? 'judges' : 'people'}</h2><p class="small muted">Copy rows from Excel or Google Sheets and paste them here, without the header row. Columns in this order: <b>${hint}</b>.${table === 'staff' ? ' Role must be one of: ' + STAFF_ROLES.join(', ') + '.' : ' Panel is the panel name; new panels are created.'}</p><textarea id="m_csv" rows="10"></textarea>`,
  async () => { const lines = $('#m_csv').value.split(/\r?\n/).filter(x => x.trim()); let n = 0;
    for (const line of lines) { const c = line.split(line.includes('\t') ? '\t' : ',').map(x => x.trim()); const row = {location_id: l.id}; keys.forEach((k, i) => row[k] = c[i] || null);
      if (!row.full_name) continue;
      if (table === 'judges' && row.panel) { let pn = S.data.panels.find(p => p.location_id === l.id && p.name.toLowerCase() === row.panel.toLowerCase()); if (!pn) { pn = await api.insert('panels', {location_id: l.id, name: row.panel, sort: S.data.panels.length + 1}); S.data.panels.push(pn); } row.panel_id = pn.id; }
      delete row.panel; if (table === 'staff' && !STAFF_ROLES.includes(row.role)) row.role = 'Volunteer';
      await api.insert(table, row); n++; }
    await reload(); render(); toast(`Imported ${n}`); });
}
function downloadCSV(name, rows) {
  const csv = rows.map(r => r.map(v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type: 'text/csv'})); a.download = name; a.click();
}

/* ===================== public registration form ===================== */
async function renderRegister() {
  $('#top').hidden = true; $('#tabs').hidden = true; stopScan();
  let setup = {events: [], locations: []}; try { setup = await api.publicSetup(); } catch (e) { toast(e.message, true); }
  const E = setup.events[0] || {};
  $('#app').innerHTML = `<div class="login card" style="max-width:640px"><div style="background:linear-gradient(135deg,var(--eb),var(--db));border-radius:10px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><img src="${LOGO_SA}" alt="NASA Space Apps" style="height:52px;width:auto"><img src="${LOGO_PARTNERS}" alt="Partners" style="height:38px;width:auto"></div>
  <h1>Register for ${esc(E.name || 'the event')} ${E.year || ''}</h1><p class="sub">Places are confirmed in registration order. When the location is full, new registrations join the waiting list.</p>
  <div class="form">
    <label class="f full">Location<select id="r_loc">${setup.locations.map(l => `<option value="${l.id}">${esc(l.name)}${l.venue ? ' · ' + esc(l.venue) : ''}</option>`).join('')}</select></label>
    <label class="f full">Full name<input id="r_name" autocomplete="name"></label><label class="f">Email<input id="r_email" type="email" autocomplete="email"></label><label class="f">Phone<input id="r_phone" autocomplete="tel"></label>
    <label class="f">Gender<select id="r_gender"><option value="">Prefer not to say</option><option>Female</option><option>Male</option></select></label><label class="f">Age<input id="r_age" type="number" min="5" max="100"></label>
    <label class="f">I am<select id="r_aff"><option value="">Choose…</option><option value="School">At school</option><option value="University">At university</option><option value="Work">Working</option><option value="Not working">Not working</option><option value="Other">Other</option></select></label>
    <label class="f" id="r_instW">School, university or workplace<input id="r_inst"></label>
    <label class="f full">Team name, if you already have one (optional)<input id="r_team"></label>
  </div><button class="pri big" id="r_go">Register</button><p class="small" id="r_msg" style="color:var(--bad)"></p></div><div id="r_pass"></div>`;
  $('#r_aff').onchange = () => { const v = $('#r_aff').value; $('#r_instW').firstChild.textContent = v === 'School' ? 'School name' : v === 'University' ? 'University name' : v === 'Work' ? 'Workplace' : 'School, university or workplace'; };
  $('#r_go').onclick = async () => { $('#r_msg').textContent = '';
    try { $('#r_go').disabled = true; const r = await api.rpc('public_register', {p_location: $('#r_loc').value, p_name: $('#r_name').value.trim(), p_email: $('#r_email').value.trim(), p_phone: $('#r_phone').value.trim(), p_gender: $('#r_gender').value, p_age: +$('#r_age').value || null, p_affiliation: $('#r_aff').value, p_institution: $('#r_inst').value.trim(), p_team_request: $('#r_team').value.trim()});
      const x = Array.isArray(r) ? r[0] : r;
      $('#r_pass').innerHTML = `<div class="login" style="max-width:640px"><div class="pass"><div><div class="small" style="color:var(--ny);font-weight:700;letter-spacing:.1em">BOARDING PASS · ${esc(x.location_name)}</div><div style="font-family:var(--h);font-weight:900;font-size:26px">${esc(x.full_name)}</div><div style="font-family:var(--h);font-weight:900;font-size:22px;margin-top:6px">${x.pass_id}</div><div style="margin-top:8px"><span class="chip ${x.status === 'registered' ? 'c-att' : 'c-wait'}">${x.status === 'registered' ? 'Confirmed' : 'Waiting list (standby)'}</span></div><p class="small" style="opacity:.9">Take a screenshot and show this QR code at check-in.</p></div><div class="qr" id="r_qr"></div></div></div>`;
      if (window.QRCode) new QRCode($('#r_qr'), {text: `ID: ${x.pass_id}\nName: ${x.full_name}\nTeam: N/A\nTeam No: N/A`, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M});
      $('#r_go').hidden = true; $('#r_pass').scrollIntoView({behavior: 'smooth'});
    } catch (e) { $('#r_msg').textContent = e.message; $('#r_go').disabled = false; } };
}

boot();
</script>
